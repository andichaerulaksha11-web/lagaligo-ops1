<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ratu Ngemil POS</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta name="theme-color" content="#FCB001">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--y:#FCB001;--g:#228b22;--soft:#fff6dd;--tx:#2b2113;--mu:#7a6a4f;--ln:#f0e2b8;--r:16px}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:#fff;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:var(--y);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:44px;background:#fff;border-radius:10px;padding:2px}
header b{font-size:18px}
main{max-width:980px;margin:auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--y);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font:600 11px inherit;color:var(--mu);min-height:56px}
nav button.on{color:#000;background:var(--soft);box-shadow:inset 0 3px var(--y)}
nav i{display:block;font-style:normal;font-size:20px}
h3{margin-bottom:6px;font-size:17px}
.card{border:1.5px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;height:48px;border:1.5px solid var(--ln);border-radius:12px;padding:0 12px;font:inherit;background:#fff}
input[type=file]{padding-top:11px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--y)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--g);color:#fff;font:700 17px inherit;margin-top:12px}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.red{background:#c62828}
.btn.sm{width:auto;min-height:40px;padding:0 12px;font-size:14px;margin:2px 0}
.chips{display:flex;gap:8px}
.chips button{flex:1;min-height:48px;border:2px solid var(--y);border-radius:12px;background:#fff;font:700 14px inherit}
.chips .on{background:var(--y)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:6px}
.tile{border:1.5px solid var(--ln);border-radius:12px;background:#fff;padding:6px;font:inherit;text-align:center}
.tile img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft)}
.ph{display:flex;align-items:center;justify-content:center;font-size:30px}
.tile span{display:block;font-size:12px;font-weight:700;line-height:1.2}
.tile small{color:var(--g);font-weight:700}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.li button{width:40px;height:40px;border:0;border-radius:10px;background:var(--soft);font:700 20px inherit;flex:none}.li .pl{background:var(--g);color:#fff}.q{display:flex;align-items:center}.q b{min-width:30px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:8px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--soft);border-radius:var(--r);padding:12px}
.kpi:first-child{grid-column:1/-1}
.kpi small,.mu{color:var(--mu)}.kpi b{display:block;font-size:22px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--y);text-align:left}td,th{padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}
.hb{display:grid;grid-template-columns:104px 1fr 48px;gap:6px;align-items:center;font-size:13px;margin:6px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{background:var(--soft);border-radius:6px;height:14px}.bar i{display:block;height:100%;background:var(--y);border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;font-size:9px;text-align:center;min-width:0}
.cols i{background:var(--y);border-radius:3px 3px 0 0;display:block}
.g{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ins .card{margin:0;background:var(--soft);border:0}.ins b{display:block;font-size:17px}
#m{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center}
#m.on{display:flex}
#m>div{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.rc{font:13px/1.5 ui-monospace,Menlo,monospace;text-align:center;border:1.5px dashed var(--mu);padding:12px;border-radius:10px;margin:8px 0}
.rc img{height:76px}.rc .l{display:flex;justify-content:space-between;text-align:left;gap:8px}
</style>
</head>
<body>
<header><img src="logo.jpg" alt="Ratu Ngemil"><b>RATU NGEMIL POS</b></header>
<main id="v"></main>
<nav id="nv"></nav>
<div id="m"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Penyimpanan penuh. Hapus foto produk yang besar.')}};
let P=[],T=[],role='',busy=0,cart=[],type='REGULER',page='kasir',ed=null,ph='';
const day=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>day(Date.now()),sum=a=>a.reduce((s,x)=>s+x.total,0),inR=(t,a,b)=>t.ts>=a&&t.ts<b;
const wk=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return +d};
const mo=(o=0)=>{const d=new Date();return +new Date(d.getFullYear(),d.getMonth()+o,1)};
const qty=a=>{const m={};a.forEach(t=>t.items.forEach(i=>m[i.name]=(m[i.name]||0)+i.qty));return m};
const rank=(m,asc)=>{const r=P.map(p=>[p.name,m[p.name]||0]);Object.keys(m).forEach(n=>{if(!asc&&!P.some(p=>p.name==n))r.push([n,m[n]])});return r.sort((a,b)=>asc?a[1]-b[1]:b[1]-a[1])};
const D=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const hb=(rows,f=x=>x)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.length?rows.map(r=>`<div class=hb><span>${esc(r[0])}</span><div class=bar><i style="width:${r[1]/mx*100}%"></i></div><b>${f(r[1])}</b></div>`).join(''):'<p class=mu>Belum ada data.</p>'};
const cols=(v,l)=>{const mx=Math.max(1,...v);return `<div class=cols>${v.map((x,i)=>`<div title="${l[i]}: ${x}"><i style="height:${x/mx*100}%;min-height:${x?2:0}px"></i>${l[i]}</div>`).join('')}</div>`};
const im=(p,s)=>p.photo?`<img src="${p.photo}" alt="" ${s?`style="width:${s}px;height:${s}px;border-radius:8px;object-fit:cover"`:''}>`:`<div class=ph ${s?`style="width:${s}px;height:${s}px;font-size:${s/2}px"`:''}>🍿</div>`;
const modal=h=>{$('#m').innerHTML='<div>'+h+'</div>';$('#m').classList.add('on')},cm=()=>$('#m').classList.remove('on');
const fmt=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ADDR='Jl. Poros Malino (Depan UPL PLN), Mawang, Kab. Gowa',TELP='0823-4698-1474';

/* ---------- STRUK ---------- */
const rtext=t=>`*RATU NGEMIL*\n${ADDR}\n--------------------\n${new Date(t.ts).toLocaleString('id-ID')} (${t.type})\n${t.items.map(i=>`${i.qty}x ${i.name} @${rp(i.price)} = ${rp(i.qty*i.price)}`).join('\n')}\n--------------------\nTotal: ${rp(t.total)}\nBayar: ${rp(t.paid)}\nKembali: ${rp(t.change)}\n--------------------\nTerima kasih sudah memesan produk kami\nKritik, Saran, & Info Pemesanan, Hubungi : ${TELP}`;
const rhtml=t=>`<div class=rc><img src="logo.jpg" alt=""><br><b>RATU NGEMIL</b><br>${ADDR}<hr>${fmt(t.ts)} · ${t.type}<hr>${t.items.map(i=>`<div class=l><span>${i.qty}× ${esc(i.name)}</span><span>${rp(i.qty*i.price)}</span></div>`).join('')}<hr><div class=l><b>Total</b><b>${rp(t.total)}</b></div><div class=l><span>Bayar</span><span>${rp(t.paid)}</span></div><div class=l><span>Kembali</span><span>${rp(t.change)}</span></div><hr>Terima kasih sudah memesan produk kami<br>Kritik, Saran, &amp; Info Pemesanan, Hubungi : ${TELP}</div>`;
function ask(id){modal(`<h3>Kirim Struk Pembelian?</h3><div class=row><button class="btn sec" onclick=cm()>Tidak</button><button class=btn onclick=wa(${id})>Ya</button></div>`)}
function wa(id){const t=T.find(x=>x.id==id);modal(`<h3>Kirim Struk</h3>${rhtml(t)}<label>Nomor WhatsApp pelanggan</label><input id=wn type=tel inputmode=tel placeholder="08xxxxxxxxxx"><button class=btn onclick=send(${id})>Kirim</button><button class="btn sec" onclick=cm()>Batal</button>`)}
function send(id){let n=$('#wn').value.replace(/\D/g,'');if(n[0]=='0')n='62'+n.slice(1);else if(n[0]=='8')n='62'+n;if(n.length<10)return alert('Nomor WhatsApp belum benar.');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(rtext(T.find(x=>x.id==id))),'_blank');cm()}

/* ---------- KASIR ---------- */
const total=()=>cart.reduce((s,i)=>s+i.qty*i.price,0);
function txTable(l,act){return l.length?`<div class=tw><table><tr><th>${act?'Waktu':'Jam'}<th>Rincian<th>Jenis<th>Total${act&&role=='kasir'?'<th>Aksi':''}</tr>${l.map(t=>`<tr><td>${act?fmt(t.ts):new Date(t.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<td>${t.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}<td>${t.type}<td>${rp(t.total)}${act&&role=='kasir'?`<td><button class="btn sm sec" onclick=wa(${t.id})>Struk</button> <button class="btn sm sec" onclick=edt(${t.id})>Edit</button> <button class="btn sm red" onclick=dlt(${t.id})>Hapus</button>`:''}</tr>`).join('')}</table></div>`:'<p class=mu>Belum ada transaksi.</p>'}
function kasir(){const tt=T.filter(t=>day(t.ts)==today()).sort((a,b)=>b.ts-a.ts);
return `<div class=card><h3>Input Penjualan</h3><div id=tiles></div>
<label>Nama produk</label><input id=pn oninput=pick() placeholder="Cari atau ketik nama produk" autocomplete=off onkeydown="if(event.key=='Enter')enter()">
</div>
<div class=card><h3>Pesanan</h3><div id=cart></div>
<label>Jenis transaksi</label><div class=chips>${['REGULER','GRAB','SHOPEE'].map(x=>`<button class="${x==type?'on':''}" onclick="setType('${x}')">${x}</button>`).join('')}</div>
<label>Jumlah bayar</label><input id=pay type=number inputmode=numeric oninput=calc() placeholder="0">
<label>Kembalian</label><input id=chg readonly value="Rp0"><button class=btn onclick=bayar()>BAYAR</button></div>
<div class=card><h3>Transaksi Hari Ini</h3>${txTable(tt,0)}</div>`}
function setType(x){type=x;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b.textContent==x))}
const find=n=>P.find(p=>p.name.toLowerCase()==String(n).trim().toLowerCase());
function matches(){const s=($('#pn').value||'').trim().toLowerCase();return s?P.filter(p=>p.name.toLowerCase().includes(s)):[]}
function drawTiles(){const s=($('#pn').value||'').trim(),q=qty(T.filter(t=>t.ts>=Date.now()-30*864e5));if(!P.length){$('#tiles').innerHTML='<p class=mu>Master Data masih kosong. Tambahkan produk dulu di tab Master Data.</p>';return}
const l=s?matches():[...P].sort((a,b)=>(q[b.name]||0)-(q[a.name]||0)).slice(0,3);
$('#tiles').innerHTML=l.length?`<div class=tiles>${l.map(p=>`<button class=tile onclick="quick(${p.id})">${im(p)}<span>${esc(p.name)}</span><small>${rp(p.price)}</small></button>`).join('')}</div>`+(!s&&P.length>l.length?`<p class=mu>Menampilkan ${l.length} produk terlaris. Ketik nama untuk mencari produk lain.</p>`:''):'<p class=mu>Produk tidak ditemukan.</p>'}
function pick(){drawTiles()}
function enter(){const m=matches();if(m.length==1)quick(m[0].id)}
function push(p,q){const c=cart.find(i=>i.name==p.name);c?c.qty+=q:cart.push({name:p.name,price:p.price,qty:q});drawCart()}
function quick(id){push(P.find(p=>p.id==id),1);$('#pn').value='';drawTiles()}
function drawCart(){$('#cart').innerHTML=cart.length?cart.map((i,k)=>`<div class=li><div style="flex:1;min-width:0"><div style="font-weight:600;line-height:1.2">${esc(i.name)}</div><small class=mu>${rp(i.qty*i.price)}</small></div><div class=q><button onclick=chg(${k},-1)>−</button><b>${i.qty}</b><button class=pl onclick=chg(${k},1)>+</button></div></div>`).join('')+`<div class=tot><span>Total</span><span>${rp(total())}</span></div>`:'<p class=mu>Belum ada item. Pilih produk di atas.</p>';calc()}
function del(k){cart.splice(k,1);drawCart()}
function chg(k,d){cart[k].qty+=d;if(cart[k].qty<1)cart.splice(k,1);drawCart()}
function calc(){const d=(+$('#pay').value||0)-total();$('#chg').value=d>=0?rp(d):'Kurang '+rp(-d)}
async function bayar(){if(busy)return;if(!cart.length)return alert('Pesanan masih kosong.');const t=total();let p=+$('#pay').value;if(type!='REGULER'&&!p)p=t;if(p<t)return alert('Jumlah bayar kurang.');const tx={id:Date.now(),ts:Date.now(),type,items:cart,total:t,paid:p,change:p-t};busy=1;try{await api('puttx',{tx})}catch(e){busy=0;return alert('Gagal menyimpan. Cek koneksi internet.')}busy=0;T.push(tx);cart=[];render();ask(tx.id)}

/* ---------- DASHBOARD ---------- */
function dash(){const n=new Date(),td=T.filter(t=>day(t.ts)==today()),mt=T.filter(t=>inR(t,mo(),mo(1))),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),dv=Array(dim).fill(0);mt.forEach(t=>dv[new Date(t.ts).getDate()-1]+=t.total);
const m=qty(T.filter(t=>t.ts>=wk())),jt={};mt.forEach(t=>jt[t.type]=(jt[t.type]||0)+t.total);
return `<div class=kpis><div class=kpi><small>Penjualan Hari Ini</small><b>${rp(sum(td))}</b></div><div class=kpi><small>Transaksi Hari Ini</small><b>${td.length}</b></div><div class=kpi><small>Rata-rata per transaksi</small><b>${rp(td.length?sum(td)/td.length:0)}</b></div></div><br>
<div class=card><h3>Trend Pendapatan Harian (tanggal 1–${dim})</h3>${cols(dv,dv.map((_,i)=>i==0||(i+1)%5==0?i+1:''))}<p class=mu>Total bulan ini: ${rp(sum(mt))}</p></div>
<div class=card><h3>TOP 10 Terlaris Minggu Ini</h3>${hb(rank(m).slice(0,10).filter(r=>r[1]>0))}</div>
<div class=card><h3>TOP 10 Penjualan Terendah Minggu Ini</h3>${hb(rank(m,1).slice(0,10))}</div>
<div class=card><h3>Pendapatan per Jenis Transaksi (bulan ini)</h3>${hb(Object.entries(jt),x=>Math.round(x/1000)+'rb')}</div>`}

/* ---------- RIWAYAT ---------- */
let rf=day(mo()),rt=today();
function riw(){const a=+new Date(rf+'T00:00'),b=+new Date(rt+'T23:59:59'),l=T.filter(t=>t.ts>=a&&t.ts<=b).sort((x,y)=>y.ts-x.ts);
return `<div class=card><h3>Riwayat Transaksi</h3><div class=row><div><label>Dari</label><input type=date value="${rf}" onchange="if(this.value){rf=this.value;render()}"></div><div><label>Sampai</label><input type=date value="${rt}" onchange="if(this.value){rt=this.value;render()}"></div></div><p style="margin:10px 0"><b>${l.length}</b> transaksi, total <b>${rp(sum(l))}</b></p>${txTable(l,1)}</div>`}
function edt(id){const t=T.find(x=>x.id==id);modal(`<h3>Edit Transaksi</h3><label>Jenis transaksi</label><select id=et>${['REGULER','GRAB','SHOPEE'].map(x=>`<option ${x==t.type?'selected':''}>${x}</option>`).join('')}</select>${t.items.map((i,k)=>`<label>${esc(i.name)} (${rp(i.price)}): jumlah, 0 untuk hapus item</label><input type=number inputmode=numeric id=eq${k} value=${i.qty}>`).join('')}<label>Jumlah bayar</label><input type=number inputmode=numeric id=ep value=${t.paid}><button class=btn onclick=sve(${id})>Simpan perubahan</button><button class="btn sec" onclick=cm()>Batal</button>`)}
function sve(id){const t=T.find(x=>x.id==id);t.type=$('#et').value;t.items.forEach((i,k)=>i.qty=+$('#eq'+k).value||0);t.items=t.items.filter(i=>i.qty>0);if(!t.items.length)return alert('Minimal 1 item. Untuk menghapus transaksi, pakai tombol Hapus.');t.total=t.items.reduce((s,i)=>s+i.qty*i.price,0);t.paid=+$('#ep').value||t.total;t.change=Math.max(0,t.paid-t.total);api('puttx',{tx:t}).catch(()=>alert('Gagal menyimpan perubahan.'));cm();render()}
function dlt(id){if(confirm('Hapus transaksi ini?')){T=T.filter(x=>x.id!=id);api('deltx',{id}).catch(()=>alert('Gagal menghapus.'));render()}}

/* ---------- SUMMARY ---------- */
function summ(){const cur=T.filter(t=>inR(t,mo(),mo(1))),prv=T.filter(t=>inR(t,mo(-1),mo())),qc=qty(cur),qp=qty(prv);
if(!cur.length)return '<div class=card><h3>Summary</h3><p class=mu>Belum ada transaksi bulan ini. Insight muncul setelah ada penjualan.</p></div>';
const hr=Array(24).fill(0),dw=Array(7).fill(0);cur.forEach(t=>{const d=new Date(t.ts);hr[d.getHours()]++;dw[d.getDay()]++});
const tp=rank(qc)[0],lo=rank(qc,1)[0],h=hr.indexOf(Math.max(...hr)),pd=dw.indexOf(Math.max(...dw)),sd=dw.indexOf(Math.min(...dw)),o1=sum(cur),o0=sum(prv);
const gr=Object.keys(qc).filter(n=>qp[n]).map(n=>[n,Math.round((qc[n]-qp[n])/qp[n]*100)]).sort((a,b)=>b[1]-a[1]);
const q14=qty(T.filter(t=>t.ts>=Date.now()-14*864e5)),dead=P.filter(p=>!q14[p.name]).map(p=>p.name);
const c=(a,b)=>`<div class=card><small class=mu>${a}</small><b>${b}</b></div>`;
return `<div class=ins>${c('🏆 Terlaris bulan ini',tp?`${esc(tp[0])} (${tp[1]} terjual)`:'-')}${c('🐌 Penjualan terendah bulan ini',lo?`${esc(lo[0])} (${lo[1]} terjual)`:'-')}${c('💰 Omzet bulan ini',rp(o1)+(o0?` (${o1>=o0?'▲':'▼'} ${Math.abs(Math.round((o1-o0)/o0*100))}% dari bulan lalu)`:''))}${c('⏰ Jam paling ramai',`${h}:00 sampai ${h+1}:00 (${hr[h]} transaksi)`)}${c('📅 Hari paling ramai',D[pd])}${c('😴 Hari paling sepi',D[sd])}${c('🧾 Rata-rata belanja',rp(o1/cur.length))}${c('📦 Tidak terjual 14 hari terakhir',dead.length?dead.map(esc).join(', '):'Semua produk laku')}</div><br>
<div class=card><h3>Jumlah transaksi per jam</h3>${cols(hr,hr.map((_,i)=>i%3==0?i:''))}</div>
<div class=card><h3>Jumlah transaksi per hari</h3>${hb(D.map((d,i)=>[d,dw[i]]))}</div>
<div class=card><h3>Perubahan penjualan produk vs bulan lalu</h3>${gr.length?gr.map(([n,p])=>`<div class=g><span>${esc(n)}</span><b style="color:${p>=0?'#228b22':'#c62828'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</b></div>`).join(''):'<p class=mu>Perlu data bulan lalu untuk perbandingan.</p>'}</div>`}

/* ---------- MASTER DATA ---------- */
function mast(){const e=P.find(p=>p.id==ed);return `<div class=card><h3>${e?'Edit':'Tambah'} Produk</h3><label>Nama produk</label><input id=mn value="${e?esc(e.name):''}"><label>Harga satuan (Rp)</label><input id=mp type=number inputmode=numeric value="${e?e.price:''}"><label>Foto produk${e?' (kosongkan jika tidak diganti)':''}</label><input type=file accept="image/*" onchange=foto(this)><div id=prev></div><button class=btn onclick=simpan()>Simpan</button>${e?'<button class="btn sec" onclick=batal()>Batal</button>':''}</div>
<div class=card><h3>Daftar Produk (${P.length})</h3>${P.length?`<div class=tw><table><tr><th>Foto<th>Nama<th>Harga<th>Aksi</tr>${P.map(p=>`<tr><td>${im(p,48)}<td>${esc(p.name)}<td>${rp(p.price)}<td><button class="btn sm sec" onclick=eP(${p.id})>Edit</button> <button class="btn sm red" onclick=dP(${p.id})>Hapus</button></tr>`).join('')}</table></div>`:'<p class=mu>Belum ada produk.</p>'}</div>`}
function foto(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const g=new Image();g.onload=()=>{const s=Math.min(1,240/Math.max(g.width,g.height)),c=document.createElement('canvas');c.width=g.width*s;c.height=g.height*s;c.getContext('2d').drawImage(g,0,0,c.width,c.height);ph=c.toDataURL('image/jpeg',.75);$('#prev').innerHTML=`<img src="${ph}" height=80 alt="">`};g.src=r.result};r.readAsDataURL(f)}
function simpan(){const n=$('#mn').value.trim(),pr=+$('#mp').value;if(!n||!(pr>0))return alert('Isi nama dan harga produk.');if(P.some(p=>p.id!=ed&&p.name.toLowerCase()==n.toLowerCase()))return alert('Nama produk sudah ada.');const e=P.find(p=>p.id==ed);if(e){e.name=n;e.price=pr;if(ph)e.photo=ph}else P.push({id:Date.now(),name:n,price:pr,photo:ph});api('putp',{p:P}).catch(()=>alert('Gagal menyimpan produk.'));ed=null;ph='';render()}
function batal(){ed=null;ph='';render()}
function eP(id){ed=id;ph='';render();scrollTo(0,0)}
function dP(id){if(confirm('Hapus produk ini? Riwayat transaksi lama tidak berubah.')){P=P.filter(p=>p.id!=id);api('putp',{p:P}).catch(()=>alert('Gagal menyimpan produk.'));render()}}

/* ---------- APP ---------- */
const pages={kasir,dashboard:dash,riwayat:riw,summary:summ,master:mast},tabs=[['kasir','🧾','KASIR'],['dashboard','📊','Dashboard'],['riwayat','🕘','Riwayat'],['summary','💡','Summary'],['master','📦','Master Data']];
function go(p){page=p;render();scrollTo(0,0)}
function render(){$('#v').innerHTML=pages[page]();$('#nv').innerHTML=tabs.filter(t=>role=='kasir'||!['kasir','master'].includes(t[0])).map(t=>`<button class="${t[0]==page?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');if(page=='kasir'){drawCart();drawTiles()}}
$('#m').addEventListener('click',e=>{if(e.target.id=='m')cm()});
const api=async(a,b={})=>{const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,pin:localStorage.getItem('rn_pin'),...b})});if(r.status==401){const e=new Error('401');e.auth=1;throw e}if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,150))}return r.json()};
function loginUI(m=''){$('#nv').innerHTML='';$('#v').innerHTML=`<div class=card><h3>Masuk</h3><p class=mu>${m}</p><label>PIN</label><input id=pin type=password inputmode=numeric autocomplete=current-password><button class=btn onclick=login()>Masuk</button></div>`}
function login(){localStorage.setItem('rn_pin',$('#pin').value.trim());boot()}
function logout(){localStorage.removeItem('rn_pin');role='';loginUI()}
async function boot(){$('#v').innerHTML='<p class=mu>Memuat data...</p>';try{const d=await api('load');role=d.role;P=d.p;T=d.t;if(role=='kasir'&&!P.length&&!T.length){const lp=L('rn_p'),lt=L('rn_t');if((lp.length||lt.length)&&confirm('Ada data lama di browser ini. Impor ke database?')){await api('import',{p:lp,t:lt});const e=await api('load');P=e.p;T=e.t}}page=role=='kasir'?'kasir':'dashboard';render()}catch(e){if(e.auth)loginUI('PIN salah. Coba lagi.');else $('#v').innerHTML=`<div class=card><p>Gagal memuat data.</p><p class=mu>Detail: ${esc(e.message)}</p><button class=btn onclick=boot()>Coba lagi</button></div>`}}
setInterval(async()=>{if(role=='pantau'&&document.visibilityState=='visible'&&!$('#m').classList.contains('on'))try{const d=await api('load');P=d.p;T=d.t;render()}catch(e){}},30000);
boot();
</script>
</body>
</html>
